<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #153247; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
    button { border: 0; border-radius: 10px; background: #087f86; color: white; padding: 12px 17px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:hover { background: #076c72; }
    button.recording { background: #b53c45; }
    .status { font-size: 13px; color: #607584; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: #a9bac2; }
    .recording + .status .dot { background: #d84954; box-shadow: 0 0 0 4px #d8495420; }
    .error { color: #a3343e; }
  </style>
</head>
<body>
  <div class="row">
    <button id="mic" type="button">🎙 Start speaking</button>
    <span id="status" class="status"><span class="dot"></span><span id="message">Microphone ready</span></span>
  </div>
  <script>
    const send = (type, extra = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
    const button = document.getElementById("mic");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let running = false;
    let finalTranscript = "";
    let latestTranscript = "";
    const setHeight = () => send("streamlit:setFrameHeight", {height: 62});

    send("streamlit:componentReady", {apiVersion: 1});
    setHeight();
    window.addEventListener("message", event => {
      if (event.data && event.data.type === "streamlit:render") setHeight();
    });

    if (!SpeechRecognition) {
      button.disabled = true;
      button.style.opacity = "0.55";
      message.textContent = "Voice recognition is unavailable in this browser. Type the transcript below.";
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onstart = () => {
        running = true;
        button.textContent = "■ Stop recording";
        button.classList.add("recording");
        status.classList.remove("error");
        message.textContent = "Listening… speak clearly, then stop";
      };
      recognition.onresult = event => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += text.trim() + " ";
          else interim += text;
        }
        latestTranscript = (finalTranscript + interim).trim();
        if (interim) message.textContent = "Recognized: " + interim;
      };
      recognition.onerror = event => {
        status.classList.add("error");
        const errors = {"not-allowed": "Microphone permission was denied. Allow microphone access in your browser settings.", "no-speech": "No speech detected. Try again.", "audio-capture": "No microphone was found."};
        message.textContent = errors[event.error] || ("Speech recognition error: " + event.error);
      };
      recognition.onend = () => {
        running = false;
        button.textContent = "🎙 Start speaking";
        button.classList.remove("recording");
        if (latestTranscript) {
          message.textContent = "Transcript added below. Review and correct it before generating.";
          send("streamlit:setComponentValue", {value: {transcript: latestTranscript, event_id: Date.now() + Math.random()}, dataType: "json"});
        } else if (!status.classList.contains("error")) message.textContent = "No speech recognized. Try again or type below.";
      };
      button.addEventListener("click", () => {
        if (running) recognition.stop();
        else {
          finalTranscript = "";
          latestTranscript = "";
          try { recognition.start(); }
          catch (_) { message.textContent = "Microphone is starting. Wait a moment and try again."; }
        }
      });
    }
  </script>
</body>
</html>
